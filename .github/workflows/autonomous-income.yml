name: MicroCorp AI • 24/7 Cloud Autonomous Enterprise

on:
  schedule:
    # Runs continuously every 2 hours (24/7 autonomous fleet operations)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target Domain (all, digital_products, freelance)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - digital_products
          - freelance
      topic:
        description: 'Custom Technical Topic (leave empty for autonomous trending topic)'
        required: false
        default: ''
        type: string
      create_release:
        description: 'Publish generated packages to GitHub Releases with direct UPI checkout'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  autonomous-cloud-enterprise:
    name: Autonomous Cloud Cycle Execution
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Legal Compliance & Architecture Test Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYOUT_UPI_ID: "talpesh100@ybl"
          PAYEE_NAME: "Alpesh Thakor"
        run: |
          python -m unittest tests/test_microcorp.py

      - name: Execute Autonomous Cloud Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAYOUT_UPI_ID: "talpesh100@ybl"
          PAYEE_NAME: "Alpesh Thakor"
          ENABLE_GITHUB_RELEASES: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/run_cloud_cycle.py --domain "${{ inputs.domain || 'all' }}"

      - name: Upload Generated Release Packages (ZIP Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: microcorp-deliverables-${{ github.run_number }}
          path: |
            deliverables/**/*.zip
            deliverables/**/*.md
            deliverables/**/*.html
          retention-days: 30

      - name: Publish GitHub Releases with Downloadable Toolkits & UPI Settlement
        if: ${{ github.event_name == 'schedule' || inputs.create_release != false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="release-run-${{ github.run_number }}"
          TITLE="MicroCorp AI • Commercial Release #${{ github.run_number }}"
          ZIP_FILES=$(find deliverables -type f -name "*.zip" | head -n 3)
          if [ -n "$ZIP_FILES" ]; then
            echo "Publishing release $TAG_NAME with files:"
            echo "$ZIP_FILES"
            gh release create "$TAG_NAME" $ZIP_FILES \
              --title "$TITLE" \
              --notes "Autonomous enterprise commercial release #${{ github.run_number }}. Verified by Legal Guardian. Direct settlement: talpesh100@ybl (Alpesh Thakor)." || echo "Release creation skipped or already exists."
          fi

      - name: Commit and Push Updated Deliverables & Enterprise Treasury State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f deliverables/ || true
          git add data/*.db data/*.json || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "auto(cloud): record autonomous 24/7 cloud deliverables & state [$(date -u +'%Y-%m-%d %H:%M:%SZ')]"
            git push origin main
          fi
