name: Autonomous MicroCorp AI Income Engine

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target Income Domain (digital_products, newsletter, freelance, all)'
        required: true
        default: 'all'
  schedule:
    # Run once daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  run-autonomous-enterprise:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout MicroCorp Enterprise Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System and Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Legal Guardian & System Test Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m unittest tests/test_microcorp.py

      - name: Execute Autonomous Passive Income & Freelance Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          from core.database import init_db
          from core.ceo_orchestrator import ceo
          from tools.freelance_harvester import freelance_harvester
          from core.freelance_distributor import freelance_distributor
          
          init_db()
          print('🚀 Running MicroCorp AI Cloud Autonomous Cycle...')
          
          # 1. Run internal income generation cycle
          summary = ceo.run_daily_income_cycle()
          print('Income cycle completed:', summary)
          
          # 2. Harvest legal freelance jobs and execute 100% turnkey plan
          jobs = freelance_harvester.fetch_all_platform_gigs()
          approved = [j for j in jobs if j.get('legal_audit', {}).get('is_legal')]
          if approved:
              print(f'Discovered {len(approved)} legal freelance opportunities. Distributing top gig...')
              res = freelance_distributor.plan_and_distribute_gig(approved[0])
              print('Freelance gig distribution result:', res.get('status'), res.get('deliverable_zip'))
          "

      - name: Commit and Push Generated Cloud Deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deliverables/ data/ || true
          if git diff --staged --quiet; then
            echo "No new cloud deliverables to commit."
          else
            git commit -m "auto(cloud): record autonomous cloud deliverables & treasury state [$(date -u +'%Y-%m-%d %H:%M:%SZ')]"
            git push origin main
          fi
