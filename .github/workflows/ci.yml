name: MicroCorp AI & Agency Agents CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify The Agency Agents (268+ Personas across 18 Divisions)
      run: |
        python -c "
        from core.agency_agents_manager import agency_agents_manager
        divs = agency_agents_manager.get_divisions()
        agents = agency_agents_manager.get_agents()
        print(f'Divisions loaded: {len(divs)}')
        print(f'Total specialized agents: {len(agents)}')
        assert len(divs) == 18, f'Expected 18 divisions, got {len(divs)}'
        assert len(agents) >= 260, f'Expected >= 260 agents, got {len(agents)}'
        "

    - name: Run Full Automated Verification Suite (19 Tests)
      run: |
        python -m unittest -v tests/test_microcorp.py
