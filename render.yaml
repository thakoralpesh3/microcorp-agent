services:
  - type: web
    name: microcorp-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app.py --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PAYOUT_UPI_ID
        value: "talpesh100@ybl"
      - key: PAYEE_NAME
        value: "Alpesh Thakor"
      - key: GEMINI_API_KEY
        sync: false
